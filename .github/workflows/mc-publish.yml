name: publish
on:
  workflow_call:
    inputs:
      java:
        type: string
        required: true
      cache:
        type: boolean
        default: true
        required: false

      version_type:
        type: string
        required: true

      publish_task:
        type: string
        default: publishMods
        required: false

    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_info: ${{ steps.get_version.outputs.version_info }}
      version_plain: ${{ steps.get_version.outputs.version_plain }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: setup jdk ${{ inputs.java }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "microsoft"
          java-version: ${{ inputs.java }}

      - name: Cache Wrapper
        if: ${{ inputs.cache == true }}
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Cache Dependencies
        if: ${{ inputs.cache == true }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/jars-*/
            ~/.gradle/caches/*/groovy-dsl/
            ~/.gradle/caches/transforms-*/
            ~/.gradle/caches/*/transforms/
            ~/.gradle/caches/modules-*/
            ~/.gradle/caches/fabric-loom/
            ~/.gradle/caches/neoformruntime/
            ~/.gradle/caches/VanillaGradle/
          key: gradle-deps-${{ hashFiles('**/gradle-wrapper.properties', '**/gradle.properties', '**/*.versions.toml', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', '**/versions.properties', '**/*.gradle*') }}

      - name: Publish to Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_PGP_KEY_ID: ${{ secrets.SIGNING_PGP_KEY_ID }}
          SIGNING_PGP_KEY: ${{ secrets.SIGNING_PGP_KEY }}
          SIGNING_PGP_PASSWORD: ${{ secrets.SIGNING_PGP_PASSWORD }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          ./gradlew publish

      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_APP_KEY }}

      - name: Publish mods
        if: ${{ inputs.version_type != 'NONE' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          SIGNING_PGP_KEY_ID: ${{ secrets.SIGNING_PGP_KEY_ID }}
          SIGNING_PGP_KEY: ${{ secrets.SIGNING_PGP_KEY }}
          SIGNING_PGP_PASSWORD: ${{ secrets.SIGNING_PGP_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          ./gradlew ${{ inputs.publish_task }}
